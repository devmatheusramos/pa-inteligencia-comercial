services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pa
      POSTGRES_PASSWORD: pa
      POSTGRES_DB: pa
    ports: ["5432:5432"]
    volumes:
      - ./db/00-evolution.sql:/docker-entrypoint-initdb.d/00-evolution.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pa -d pa"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine

  # Fonte de mensagens (ADR 0003). Versão fixada; porta só em localhost.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["127.0.0.1:8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://pa:pa@db:5432/evolution
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  dbdata:
  evolution_instances:
