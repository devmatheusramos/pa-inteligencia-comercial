services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pa
      POSTGRES_PASSWORD: pa
      POSTGRES_DB: pa
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
