<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="800" viewBox="0 0 1450 800" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="1450" height="800" fill="#fff"/>
<text x="20" y="34" font-size="22" font-weight="700" fill="#222">C4 Nível 3 — Componentes do pipeline (Processador + Analisador)</text>
<rect x="40" y="90" width="230" height="100" rx="22" fill="#438dd5" stroke="#2e6295"/>
<text x="155.0" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Fila mensagens</text>
<text x="155.0" y="132" text-anchor="middle" font-size="11" font-weight="400" fill="#fff">[SQS]</text>
<text x="155.0" y="148" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">Evento bruto da Evolution</text>
<rect x="420" y="80" width="230" height="120" rx="4" fill="#85bbf0" stroke="#2e6295"/>
<text x="535.0" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#000">1. Recebimento</text>
<text x="535.0" y="122" text-anchor="middle" font-size="11" font-weight="400" fill="#000">[Componente]</text>
<text x="535.0" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#000">Normaliza messages.upsert:</text>
<text x="535.0" y="155" text-anchor="middle" font-size="12" font-weight="400" fill="#000">fromMe define cliente ou</text>
<text x="535.0" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#000">vendedor; ignora grupos</text>
<rect x="800" y="80" width="230" height="120" rx="4" fill="#85bbf0" stroke="#2e6295"/>
<text x="915.0" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#000">2. Mascaramento</text>
<text x="915.0" y="122" text-anchor="middle" font-size="11" font-weight="400" fill="#000">[Componente]</text>
<text x="915.0" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#000">CPF, CNPJ, e-mail, telefone,</text>
<text x="915.0" y="155" text-anchor="middle" font-size="12" font-weight="400" fill="#000">CEP, cartão, PIX viram</text>
<text x="915.0" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#000">marcadores</text>
<rect x="1180" y="80" width="230" height="120" rx="4" fill="#85bbf0" stroke="#2e6295"/>
<text x="1295.0" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#000">3. Vínculo ao vendedor</text>
<text x="1295.0" y="122" text-anchor="middle" font-size="11" font-weight="400" fill="#000">[Componente]</text>
<text x="1295.0" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#000">Número do vendedor vira</text>
<text x="1295.0" y="155" text-anchor="middle" font-size="12" font-weight="400" fill="#000">vendedor_id; telefone do</text>
<text x="1295.0" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#000">cliente vira HMAC</text>
<rect x="1180" y="320" width="230" height="120" rx="4" fill="#85bbf0" stroke="#2e6295"/>
<text x="1295.0" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#000">4. Tempo de resposta</text>
<text x="1295.0" y="362" text-anchor="middle" font-size="11" font-weight="400" fill="#000">[Componente]</text>
<text x="1295.0" y="378" text-anchor="middle" font-size="12" font-weight="400" fill="#000">Turnos do cliente, horário</text>
<text x="1295.0" y="395" text-anchor="middle" font-size="12" font-weight="400" fill="#000">comercial, TPR e TMR</text>
<rect x="800" y="320" width="230" height="120" rx="4" fill="#85bbf0" stroke="#2e6295"/>
<text x="915.0" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#000">Repositório</text>
<text x="915.0" y="362" text-anchor="middle" font-size="11" font-weight="400" fill="#000">[Componente]</text>
<text x="915.0" y="378" text-anchor="middle" font-size="12" font-weight="400" fill="#000">PostgreSQL com vendedor_id em</text>
<text x="915.0" y="395" text-anchor="middle" font-size="12" font-weight="400" fill="#000">toda consulta</text>
<path d="M800,582 v116 a115.0,12 0 0 0 230,0 v-116 a115.0,12 0 0 0 -230,0 a115.0,12 0 0 0 230,0" fill="#438dd5" stroke="#2e6295"/>
<text x="915.0" y="592" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Banco</text>
<text x="915.0" y="612" text-anchor="middle" font-size="11" font-weight="400" fill="#fff">[RDS PostgreSQL]</text>
<text x="915.0" y="628" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">mensagens, conversas, analises</text>
<rect x="420" y="320" width="230" height="120" rx="4" fill="#85bbf0" stroke="#2e6295"/>
<text x="535.0" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#000">5. Análise</text>
<text x="535.0" y="362" text-anchor="middle" font-size="11" font-weight="400" fill="#000">[Componente]</text>
<text x="535.0" y="378" text-anchor="middle" font-size="12" font-weight="400" fill="#000">Monta prompt versionado com a</text>
<text x="535.0" y="395" text-anchor="middle" font-size="12" font-weight="400" fill="#000">conversa mascarada</text>
<rect x="40" y="320" width="230" height="120" rx="4" fill="#85bbf0" stroke="#2e6295"/>
<text x="155.0" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#000">AnalisadorConversa</text>
<text x="155.0" y="362" text-anchor="middle" font-size="11" font-weight="400" fill="#000">[Interface + adaptadores]</text>
<text x="155.0" y="378" text-anchor="middle" font-size="12" font-weight="400" fill="#000">Bedrock (padrão), Anthropic,</text>
<text x="155.0" y="395" text-anchor="middle" font-size="12" font-weight="400" fill="#000">OpenAI</text>
<rect x="420" y="570" width="230" height="120" rx="4" fill="#85bbf0" stroke="#2e6295"/>
<text x="535.0" y="592" text-anchor="middle" font-size="15" font-weight="700" fill="#000">6. Validação da saída</text>
<text x="535.0" y="612" text-anchor="middle" font-size="11" font-weight="400" fill="#000">[Componente]</text>
<text x="535.0" y="628" text-anchor="middle" font-size="12" font-weight="400" fill="#000">Schema JSON; etapa só da lista</text>
<text x="535.0" y="645" text-anchor="middle" font-size="12" font-weight="400" fill="#000">fechada; senão reprocessa</text>
