<text x="180.0" y="312" text-anchor="middle" font-size="11" font-weight="400" fill="#fff">[evoapicloud v2.3.7, EC2 + Docker]</text>
<text x="180.0" y="328" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">Aparelho vinculado ao número do</text>
