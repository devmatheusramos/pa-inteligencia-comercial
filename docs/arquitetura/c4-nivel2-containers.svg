<text x="550.0" y="748" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">A cada 15 min: conversas paradas há</text>
<text x="550.0" y="765" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">30 min</text>
