<text x="550.0" y="518" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">Mascara dados pessoais, vincula ao</text>
<text x="550.0" y="535" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">vendedor, calcula tempo de resposta</text>
