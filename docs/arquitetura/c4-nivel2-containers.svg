<text x="905.0" y="718" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">Monta prompt, chama o LLM, valida</text>
<text x="905.0" y="735" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">JSON e grava etapa e pendências</text>
