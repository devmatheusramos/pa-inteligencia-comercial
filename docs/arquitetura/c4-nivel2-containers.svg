<text x="540.0" y="328" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">Valida o token da instância e</text>
<text x="540.0" y="345" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">enfileira</text>
